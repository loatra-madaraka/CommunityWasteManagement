
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Waste Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Community Waste Management System</h1>
        <p>Keeping our community clean and healthy</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Submit a Waste Report</h2>

            <form id="reportForm">
                <label>Resident Name</label>
                <input type="text" id="residentName" required>

                <label>Location</label>
                <input type="text" id="location" required>

                <label>Waste Type</label>
                <select id="wasteType" required>
                    <option value="">Select waste type</option>
                    <option value="Plastic">Plastic</option>
                    <option value="Organic">Organic</option>
                    <option value="Paper">Paper</option>
                    <option value="Metal">Metal</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Submit Report</button>
            </form>
            <p id="message"></p>
        </section>

        <section class="reports-section">
            <h2>Waste Reports</h2>
            <div id="reportsList">Loading reports...</div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
